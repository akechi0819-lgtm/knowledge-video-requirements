server {
    listen 80;
    server_name jiangjie.gingers.cloud;
    location /.well-known/acme-challenge/ { root /opt/jiangjie-preview/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name jiangjie.gingers.cloud;
    ssl_certificate /opt/jiangjie-preview/letsencrypt/live/jiangjie.gingers.cloud/fullchain.pem;
    ssl_certificate_key /opt/jiangjie-preview/letsencrypt/live/jiangjie.gingers.cloud/privkey.pem;
    client_max_body_size 100m;
    root /opt/jiangjie-preview/site;
    index index.html;
    location = /bohack { return 301 /bohack/; }
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location /bohack/ {
        proxy_pass http://127.0.0.1:3110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1800s;
    }
}
