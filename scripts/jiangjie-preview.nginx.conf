server {
    listen 80;
    server_name jiangjie.gingers.cloud;
    location /.well-known/acme-challenge/ { root /opt/jiangjie-preview/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name jiangjie.gingers.cloud;
    ssl_certificate /opt/jiangjie-preview/letsencrypt/live/jiangjie.gingers.cloud/fullchain.pem;
    ssl_certificate_key /opt/jiangjie-preview/letsencrypt/live/jiangjie.gingers.cloud/privkey.pem;
    client_max_body_size 100m;
    root /opt/jiangjie-preview/site;
    index index.html;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    location = /bohack { return 301 /bohack/; }
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    # Release manifests & auto-update feeds: always revalidate via ETag
    location ~ ^/downloads/.*\.(?:json|yml|yaml)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }
    # Immutable versioned installers, component archives & blockmaps (supports HTTP Range resume)
    location ^~ /downloads/ {
        etag on;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(?:css|js|png|jpe?g|webp|svg|ico|mp4)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location ^~ /bohack/ {
        proxy_pass http://127.0.0.1:3110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1800s;
    }
    location ^~ /desktop-membership/ {
        proxy_pass http://127.0.0.1:18787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        client_max_body_size 32m;
    }
}
