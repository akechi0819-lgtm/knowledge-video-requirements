<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>讲界视频工坊 · 正在准备工作台</title>
<meta http-equiv="refresh" content="10" id="fallback-refresh">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0 }
  html, body { height: 100% }
  body { display: flex; align-items: center; justify-content: center; background: #000; color: #f5f5f5;
    font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif }
  .wrap { text-align: center; padding: 24px; transform: translateY(-4vh) }
  .brand { font-size: 42px; font-weight: 800; letter-spacing: .02em; color: #f5f5f5 }
  @media (max-width: 480px) { .brand { font-size: 30px } }
  .sun { position: relative; width: 64px; height: 64px; margin: 36px auto 28px }
  .sun .rays { position: absolute; inset: 0; animation: spin 9s linear infinite }
  .sun .rays i { position: absolute; left: 50%; top: 50%; width: 3px; height: 10px; margin: -5px 0 0 -1.5px;
    border-radius: 2px; background: #ffc93c }
  .sun .rays i:nth-child(1) { transform: rotate(0deg) translateY(-27px) }
  .sun .rays i:nth-child(2) { transform: rotate(45deg) translateY(-27px) }
  .sun .rays i:nth-child(3) { transform: rotate(90deg) translateY(-27px) }
  .sun .rays i:nth-child(4) { transform: rotate(135deg) translateY(-27px) }
  .sun .rays i:nth-child(5) { transform: rotate(180deg) translateY(-27px) }
  .sun .rays i:nth-child(6) { transform: rotate(225deg) translateY(-27px) }
  .sun .rays i:nth-child(7) { transform: rotate(270deg) translateY(-27px) }
  .sun .rays i:nth-child(8) { transform: rotate(315deg) translateY(-27px) }
  .sun .core { position: absolute; inset: 14px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffe9a8, #ffc93c 60%, #f5a623);
    box-shadow: 0 0 22px 6px rgba(255, 190, 60, .5); animation: glow 2s ease-in-out infinite }
  @keyframes spin { to { transform: rotate(360deg) } }
  @keyframes glow { 50% { box-shadow: 0 0 34px 12px rgba(255, 190, 60, .8) } }
  .loading { font-family: ui-monospace, 'SF Mono', Consolas, Menlo, monospace; font-size: 15px;
    letter-spacing: .08em; color: #8a8a92 }
  .loading .d { animation: blink 1.2s infinite }
  .loading .d:nth-child(2) { animation-delay: .2s }
  .loading .d:nth-child(3) { animation-delay: .4s }
  @keyframes blink { 0%, 100% { opacity: .15 } 50% { opacity: 1 } }
  #err { display: none; margin: 20px auto 0; max-width: 340px; color: #f0b0b0; font-size: 13px }
  #retry { display: none; margin-top: 14px; padding: 7px 20px; border: 1px solid #26262c; border-radius: 8px;
    background: #131317; color: #f2f2f4; font-size: 13px; cursor: pointer }
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">讲界视频工坊</div>
  <div class="sun" aria-hidden="true">
    <div class="rays"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="core"></div>
  </div>
  <div class="loading">Loading<span class="d">.</span><span class="d">.</span><span class="d">.</span></div>
  <p id="err"></p>
  <button id="retry" type="button">立即重试</button>
</main>
<script>
(function () {
  // ES5 only: old iOS Safari must never hit a syntax error that kills polling.
  var hasFetch = typeof window.fetch === 'function'
  var fallback = document.getElementById('fallback-refresh')
  if (hasFetch && fallback && fallback.parentNode) fallback.parentNode.removeChild(fallback)
  var err = document.getElementById('err')
  var retry = document.getElementById('retry')
  var countdown = 0
  function fail(message, seconds) {
    err.textContent = message
    err.style.display = 'block'
    retry.style.display = 'inline-block'
    countdown = seconds
  }
  function enter() { location.replace('/bohack/') }
  function schedule(ms) { setTimeout(poll, ms) }
  function poll() {
    if (!hasFetch) return
    fetch('/bohack/__prepare', { cache: 'no-store' }).then(function (response) {
      return response.json()
    }).then(function (info) {
      if (!info.hasCookie) {
        fail('浏览器没有保存本站会话 Cookie（可能开启了严格隐私保护）。请在浏览器设置中允许本站 Cookie，然后刷新页面。', 0)
        return
      }
      if (info.stage === 'ready') { enter(); return }
      if (info.stage === 'failed') { fail(info.message || '工作台启动失败，将自动重试。', 15); schedule(1000); return }
      if (info.stage === 'full') { fail(info.message || '工作台实例已满，将自动重试。', 30); schedule(1000); return }
      if (info.stage === 'idle') { location.reload(); return }
      err.style.display = 'none'
      schedule(1500)
    }).catch(function () {
      schedule(2000)
    })
  }
  setInterval(function () {
    if (countdown > 0) {
      countdown -= 1
      if (countdown === 0) location.reload()
    }
  }, 1000)
  retry.addEventListener('click', function () { location.reload() })
  poll()
})()
</script>
</body>
</html>
