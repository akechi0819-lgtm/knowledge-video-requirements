<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;}
  #stage{position:relative;overflow:hidden;}
  #tag{position:absolute;font-weight:700;letter-spacing:.5px;}
  #sub{position:absolute;left:0;right:0;text-align:center;}
  #sub span{display:inline-block;color:#fff;}
  #closing{position:absolute;left:0;right:0;text-align:center;font-weight:700;}
</style>
</head>
<body>
<div id="stage">
  <svg id="art" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="tag"></div>
  <div id="sub"><span></span></div>
  <div id="closing"></div>
</div>
<script>
// Deterministic renderer: seek(t) fully describes the frame at local time t.
// No CSS transitions, no requestAnimationFrame, no wall-clock reads.
// STYLE and PLAN are injected by render.mjs before seek is ever called.

const S = window.STYLE, P = window.__PLAN__;
const PAL = S.palette, L = S.layout;
const W = S.video.width, H = S.video.height;
const SVGNS = 'http://www.w3.org/2000/svg';

const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
stage.style.background = PAL.bg;
stage.style.fontFamily = S.font.family;
const art = document.getElementById('art');
art.setAttribute('width', W); art.setAttribute('height', H);
art.setAttribute('viewBox', `0 0 ${W} ${H}`);

const clamp01 = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
const ramp = (t, t0, dur) => dur <= 0 ? (t >= t0 ? 1 : 0) : clamp01((t - t0) / dur);
const ease = (x) => x * x * (3 - 2 * x);

// ---------- shape builders (all geometry from STYLE) ----------
function chiliShape() {
  return `<g>
    <path d="M-50,10 C-40,-14 -10,-26 20,-22 C40,-19 48,-8 46,2 C42,14 20,22 -6,20 C-28,18 -44,16 -50,10 Z" fill="${PAL.chili}"/>
    <path d="M-38,4 C-28,-10 -4,-18 18,-15" stroke="${PAL.chiliShade}" stroke-width="5" fill="none" stroke-linecap="round" opacity=".55"/>
    <path d="M-30,-2 C-18,-12 2,-17 20,-14" stroke="#FF8A72" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>
    <ellipse cx="45" cy="-6" rx="11" ry="8" fill="${PAL.stem}" transform="rotate(-18 45 -6)"/>
    <path d="M48,-10 C58,-18 62,-28 59,-38" stroke="${PAL.stem}" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>`;
}
function potatoShape() {
  return `<g>
    <ellipse cx="-24" cy="8" rx="33" ry="23" fill="${PAL.potatoSkin}"/>
    <ellipse cx="-24" cy="5" rx="33" ry="23" fill="${PAL.potato}" stroke="${PAL.potatoSkin}" stroke-width="4"/>
    <ellipse cx="20" cy="-6" rx="34" ry="24" fill="${PAL.potatoSkin}"/>
    <ellipse cx="20" cy="-9" rx="34" ry="24" fill="${PAL.potato}" stroke="${PAL.potatoSkin}" stroke-width="4"/>
    <circle cx="12" cy="-14" r="2.6" fill="${PAL.potatoSkin}" opacity=".7"/>
    <circle cx="30" cy="-4" r="2.2" fill="${PAL.potatoSkin}" opacity=".7"/>
    <circle cx="-30" cy="2" r="2.4" fill="${PAL.potatoSkin}" opacity=".7"/>
  </g>`;
}
function tomatoShape() {
  return `<g>
    <circle cx="0" cy="4" r="34" fill="${PAL.tomatoShade}"/>
    <circle cx="0" cy="0" r="34" fill="${PAL.tomato}"/>
    <ellipse cx="-12" cy="-13" rx="10" ry="7" fill="#FF9A80" opacity=".75" transform="rotate(-28 -12 -13)"/>
    <path d="M0,-30 L9,-38 L6,-27 L18,-31 L9,-22 L20,-18 L7,-18 L4,-8 L-2,-18 L-15,-16 L-6,-24 L-16,-31 L-4,-28 L-8,-39 Z" fill="${PAL.stem}"/>
    <rect x="-2.5" y="-44" width="5" height="12" rx="2.5" fill="${PAL.greensDeep}"/>
  </g>`;
}
function otherFood() {
  // Retained through S2 so the disappearance reads as a real contrast (R09).
  return `<g>
    <g transform="translate(556,470)">
      <rect x="-13" y="-4" width="26" height="24" rx="5" fill="${PAL.mushroom}"/>
      <path d="M-30,-2 C-30,-26 30,-26 30,-2 Z" fill="${PAL.mushroomCap}"/>
    </g>
    <g transform="translate(724,472)">
      <path d="M-26,16 C-30,-10 -12,-26 0,-26 C12,-26 30,-10 26,16 Z" fill="${PAL.greens}"/>
      <path d="M0,16 L0,-22" stroke="${PAL.greensDeep}" stroke-width="4"/>
      <path d="M0,-6 L-14,-14 M0,2 L14,-6" stroke="${PAL.greensDeep}" stroke-width="3"/>
    </g>
    <g transform="translate(640,494)">
      <rect x="-30" y="-14" width="27" height="26" rx="4" fill="${PAL.tofu}" stroke="${PAL.tofuEdge}" stroke-width="3"/>
      <rect x="3" y="-14" width="27" height="26" rx="4" fill="${PAL.tofu}" stroke="${PAL.tofuEdge}" stroke-width="3"/>
    </g>
  </g>`;
}
function potBase() {
  const { potCx: cx, potCy: cy, potRx: rx, potRy: ry } = L;
  return `<g>
    <ellipse cx="${cx}" cy="${cy + 128}" rx="${rx + 46}" ry="34" fill="${PAL.tableEdge}" opacity=".35"/>
    <rect x="0" y="${cy + 96}" width="${W}" height="${H - cy - 96}" fill="${PAL.table}"/>
    <path d="M${cx - rx - 16},${cy} C${cx - rx - 16},${cy + 116} ${cx + rx + 16},${cy + 116} ${cx + rx + 16},${cy} Z" fill="${PAL.potOuter}"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx + 16}" ry="${ry + 14}" fill="${PAL.potRim}"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${PAL.brothDeep}"/>
    <ellipse cx="${cx}" cy="${cy - 4}" rx="${rx - 8}" ry="${ry - 10}" fill="${PAL.broth}"/>
    <ellipse cx="${cx}" cy="${cy - 4}" rx="${rx - 8}" ry="${ry - 10}" fill="url(#sheen)"/>
    <path d="M${cx - rx - 30},${cy - 6} l-40,-14 l0,28 Z" fill="${PAL.potRim}"/>
    <path d="M${cx + rx + 30},${cy - 6} l40,-14 l0,28 Z" fill="${PAL.potRim}"/>
  </g>`;
}

// ---------- schematic world map (concept diagram, not a precise history map) ----------
const MAP_OX = 150, MAP_OY = 158, MAP_S = 1.0;
const mx = (x) => MAP_OX + x * MAP_S, my = (y) => MAP_OY + y * MAP_S;
const CONTINENTS = {
  northAmerica: 'M60,60 L150,38 L232,54 L252,96 L212,132 L172,152 L150,192 L120,176 L96,132 L60,110 Z',
  southAmerica: 'M176,206 L216,200 L236,242 L226,302 L200,362 L180,342 L170,282 L160,242 Z',
  europe: 'M430,60 L492,48 L522,76 L500,106 L456,112 L430,90 Z',
  africa: 'M440,132 L520,126 L556,176 L540,242 L500,302 L470,292 L450,232 L436,182 Z',
  asia: 'M532,44 L700,34 L822,60 L862,112 L820,152 L740,162 L660,142 L580,122 L540,90 Z',
  oceania: 'M790,272 L862,266 L892,302 L860,336 L800,330 L776,302 Z',
};
const AMERICAS = ['northAmerica', 'southAmerica'];
const ORIGIN = { x: 196, y: 176 };
const TARGETS = [
  { x: 470, y: 84, name: '欧洲' },
  { x: 494, y: 210, name: '非洲' },
  { x: 726, y: 104, name: '亚洲' },
];
function mapBase() {
  let s = `<rect x="70" y="118" width="${W - 140}" height="452" rx="26" fill="${PAL.ocean}"/>`;
  for (let gx = 130; gx < W - 90; gx += 96) {
    s += `<line x1="${gx}" y1="132" x2="${gx}" y2="556" stroke="#FFFFFF" stroke-width="1.5" opacity=".45"/>`;
  }
  for (let gy = 170; gy < 556; gy += 86) {
    s += `<line x1="84" y1="${gy}" x2="${W - 84}" y2="${gy}" stroke="#FFFFFF" stroke-width="1.5" opacity=".45"/>`;
  }
  for (const [key, d] of Object.entries(CONTINENTS)) {
    const pts = d.match(/-?\d+(\.\d+)?/g).map(Number);
    let out = '';
    for (let i = 0; i < pts.length; i += 2) out += (i ? 'L' : 'M') + mx(pts[i]) + ',' + my(pts[i + 1]) + ' ';
    const isAm = AMERICAS.includes(key);
    s += `<path id="land-${key}" d="${out}Z" fill="${isAm ? PAL.land : PAL.land}" stroke="${PAL.landEdge}" stroke-width="3"/>`;
  }
  return s;
}

// ---------- build the static art once ----------
const isMap = P.kind === 'map';
let artHTML = `<defs>
  <radialGradient id="glow" cx="50%" cy="38%" r="72%">
    <stop offset="0%" stop-color="${PAL.bgGlow}"/><stop offset="100%" stop-color="${PAL.bg}"/>
  </radialGradient>
  <radialGradient id="sheen" gradientUnits="userSpaceOnUse" cx="${L.potCx}" cy="${L.potCy}" r="190">
    <stop offset="0%" stop-color="${PAL.brothBubble}" stop-opacity=".5"/>
    <stop offset="100%" stop-color="${PAL.brothBubble}" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="brothClip"><ellipse cx="${L.potCx}" cy="${L.potCy - 4}" rx="${L.potRx - 8}" ry="${L.potRy - 10}"/></clipPath>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
</defs>
<rect width="${W}" height="${H}" fill="url(#glow)"/>`;

if (isMap) {
  artHTML += `<g id="mapLayer">${mapBase()}</g>
    <g id="routes"></g><g id="travel"></g>
    <g id="mapLabels"></g>`;
} else {
  artHTML += `<g id="potLayer">${potBase()}</g>
    <g id="bubbles"></g>
    <g id="oil"></g>
    <g id="boil" clip-path="url(#brothClip)"></g>
    <g id="other">${otherFood()}</g>
    <g id="ings"></g>
    <g id="steam" filter="url(#soft)"></g>
    <g id="rings"></g><g id="labels"></g>`;
}
art.innerHTML = artHTML;

const ING_SHAPES = { chili: chiliShape, potato: potatoShape, tomato: tomatoShape };
const ING_ORDER = ['chili', 'potato', 'tomato'];
const ingNodes = {}, ringNodes = {}, labelNodes = {};

if (!isMap) {
  const ings = document.getElementById('ings');
  const rings = document.getElementById('rings');
  const labels = document.getElementById('labels');
  for (const key of ING_ORDER) {
    const pos = L[key];
    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('id', 'ing-' + key);
    g.innerHTML = ING_SHAPES[key]();
    ings.appendChild(g);
    ingNodes[key] = g;

    const r = document.createElementNS(SVGNS, 'g');
    r.innerHTML = `<ellipse cx="${pos.x}" cy="${pos.y}" rx="76" ry="58" fill="none"
      stroke="${PAL.highlight}" stroke-width="6" stroke-dasharray="14 9"/>`;
    rings.appendChild(r);
    ringNodes[key] = r;

    const lb = document.createElementNS(SVGNS, 'g');
    const text = P.ingredientLabels?.[key] ?? '';
    const tw = text.length * S.font.labelSize + 34;
    lb.innerHTML = `<rect x="${pos.x - tw / 2}" y="${pos.y + L.labelOffsetY - 30}" width="${tw}" height="50" rx="14"
        fill="${PAL.ink}" opacity=".88"/>
      <text x="${pos.x}" y="${pos.y + L.labelOffsetY + 6}" text-anchor="middle"
        font-size="${S.font.labelSize}" font-weight="${S.font.labelWeight}" fill="${PAL.highlight}"
        font-family='${S.font.family}'>${text}</text>`;
    labels.appendChild(lb);
    labelNodes[key] = lb;
  }
  // steam + bubbles are created once, animated purely as a function of t
  const steam = document.getElementById('steam');
  for (let i = 0; i < 5; i++) {
    const p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('id', 'steam-' + i);
    p.setAttribute('stroke', PAL.steam); p.setAttribute('fill', 'none');
    p.setAttribute('stroke-width', String(13 - i)); p.setAttribute('stroke-linecap', 'round');
    steam.appendChild(p);
  }
  const bub = document.getElementById('bubbles');
  for (let i = 0; i < 9; i++) {
    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('id', 'bub-' + i); c.setAttribute('fill', PAL.brothBubble);
    bub.appendChild(c);
  }
  const oil = document.getElementById('oil');
  for (let i = 0; i < 6; i++) {
    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('id', 'oil-' + i); c.setAttribute('fill', PAL.brothDeep);
    oil.appendChild(c);
  }
  const boil = document.getElementById('boil');
  for (let i = 0; i < 7; i++) {
    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('id', 'boil-' + i);
    c.setAttribute('fill', i % 2 ? PAL.brothBubble : PAL.brothDeep);
    boil.appendChild(c);
  }
}

// ---------- subtitle / tag / closing chrome ----------
const tag = document.getElementById('tag');
tag.style.left = S.segmentTag.left + 'px';
tag.style.top = S.segmentTag.top + 'px';
tag.style.fontSize = S.segmentTag.fontSize + 'px';
tag.style.color = S.segmentTag.color;
tag.textContent = P.segmentTag ?? '';

const sub = document.getElementById('sub'), subSpan = sub.firstElementChild;
sub.style.bottom = S.subtitle.bottom + 'px';
subSpan.style.fontSize = S.subtitle.fontSize + 'px';
subSpan.style.fontWeight = S.subtitle.fontWeight;
subSpan.style.background = S.subtitle.pillColor;
subSpan.style.borderRadius = S.subtitle.pillRadius + 'px';
subSpan.style.padding = `${S.subtitle.padY}px ${S.subtitle.padX}px`;
subSpan.style.maxWidth = S.subtitle.maxWidth + 'px';
subSpan.style.lineHeight = '1.35';

const closing = document.getElementById('closing');
closing.style.bottom = (S.subtitle.bottom + 6) + 'px';
closing.style.fontSize = S.font.titleSize + 'px';
closing.style.color = PAL.ink;
closing.textContent = S.subtitle.closingText;

// ---------- per-frame state ----------
function opacityFromCues(t, spec) {
  if (!spec) return 1;
  let v = spec.init ?? 1;
  for (const c of spec.cues ?? []) {
    if (t < c.t) break;
    const k = ease(ramp(t, c.t, c.dur ?? 0));
    v = v + (c.v - v) * k;
  }
  return clamp01(v);
}

function guessPulse(t, key) {
  let o = 0;
  for (const gp of P.guessPulses ?? []) {
    if (gp.key !== key) continue;
    o = Math.max(o, Math.sin(Math.PI * ramp(t, gp.t, gp.dur ?? 0.7)) * 0.55);
  }
  return o;
}

function drawHotpot(t) {
  const { potCx: cx, potCy: cy, potRx: rx, potRy: ry } = L;
  const sheen = document.getElementById('sheen');
  sheen.setAttribute('cx', (cx + Math.cos(t * 0.9) * 120).toFixed(1));
  sheen.setAttribute('cy', (cy - 4 + Math.sin(t * 1.3) * 40).toFixed(1));
  for (let i = 0; i < 7; i++) {
    const c = document.getElementById('boil-' + i);
    const bx = cx + Math.cos(t * 0.7 + i * 2.4) * (rx - 90) * 0.8;
    const by = cy - 4 + Math.sin(t * 0.9 + i * 1.7) * (ry - 50) * 0.8;
    c.setAttribute('cx', bx.toFixed(1));
    c.setAttribute('cy', by.toFixed(1));
    c.setAttribute('r', (30 + 12 * Math.sin(t * 0.6 + i)).toFixed(2));
    c.setAttribute('opacity', (0.32 + 0.12 * Math.sin(t * 0.8 + i * 2)).toFixed(3));
  }
  for (let i = 0; i < 9; i++) {
    const c = document.getElementById('bub-' + i);
    const ph = (t / S.timing.steamPeriod + i * 0.37) % 1;
    const bx = cx - rx + 60 + ((i * 137) % (2 * rx - 120));
    const by = cy + 26 - ph * 52;
    c.setAttribute('cx', bx.toFixed(1));
    c.setAttribute('cy', by.toFixed(1));
    c.setAttribute('r', (7 + 5 * Math.sin(ph * Math.PI)).toFixed(2));
    c.setAttribute('opacity', (0.85 * Math.sin(ph * Math.PI)).toFixed(3));
  }
  for (let i = 0; i < 6; i++) {
    const c = document.getElementById('oil-' + i);
    const ox = cx - rx + 50 + ((i * 211 + t * 22) % (2 * rx - 100));
    const oy = cy - 34 + ((i * 53) % 78) + Math.sin(t * 0.9 + i) * 7;
    c.setAttribute('cx', ox.toFixed(1));
    c.setAttribute('cy', oy.toFixed(1));
    c.setAttribute('r', (9 + 4 * Math.sin(t * 0.7 + i * 1.3)).toFixed(2));
    c.setAttribute('opacity', (0.35 + 0.15 * Math.sin(t * 0.8 + i)).toFixed(3));
  }
  for (let i = 0; i < 5; i++) {
    const p = document.getElementById('steam-' + i);
    const ph = (t / S.timing.steamPeriod + i * 0.21) % 1;
    const sx = cx - 150 + i * 76;
    const top = cy - 96 - ph * 150;
    const sway = Math.sin((t * 2.6) + i) * 32;
    p.setAttribute('d', `M${sx},${cy - 60} C${sx + sway},${cy - 110} ${sx - sway},${top + 40} ${sx + sway * 0.6},${top}`);
    p.setAttribute('opacity', (0.6 * Math.sin(ph * Math.PI)).toFixed(3));
  }
  for (const key of ING_ORDER) {
    const spec = P.ingredients?.[key];
    const o = opacityFromCues(t, spec);
    const pos = L[key];
    const pop = spec?.cues?.length ? 1 : 1;
    ingNodes[key].setAttribute('opacity', o.toFixed(3));
    ingNodes[key].setAttribute('transform', `translate(${pos.x},${pos.y}) scale(${(0.86 + 0.14 * o).toFixed(3)})`);
    const hl = spec?.label;
    let ho = 0;
    if (hl) {
      const inR = ease(ramp(t, hl.t, 0.18));
      const outR = hl.until != null ? 1 - ease(ramp(t, hl.until, 0.22)) : 1;
      ho = clamp01(inR * outR);
    }
    ringNodes[key].setAttribute('opacity', Math.max(ho * 0.95, guessPulse(t, key)).toFixed(3));
    const pulse = 1 + 0.05 * Math.sin(t * 6);
    ringNodes[key].setAttribute('transform',
      `translate(${pos.x},${pos.y}) scale(${pulse.toFixed(3)}) translate(${-pos.x},${-pos.y})`);
    labelNodes[key].setAttribute('opacity', ho.toFixed(3));
    labelNodes[key].setAttribute('transform', `translate(0,${(-8 * (1 - ho)).toFixed(2)})`);
  }
}

function drawMap(t) {
  const am = P.americasHighlight;
  for (const key of AMERICAS) {
    const el = document.getElementById('land-' + key);
    let k = 0;
    if (am) k = ease(ramp(t, am.t, 0.4));
    el.setAttribute('fill', k > 0.02 ? PAL.highlight : PAL.land);
    el.setAttribute('stroke', k > 0.02 ? PAL.route : PAL.landEdge);
    el.setAttribute('stroke-width', (3 + 2 * k).toFixed(2));
  }
  const routes = document.getElementById('routes');
  const travel = document.getElementById('travel');
  const lab = document.getElementById('mapLabels');
  const spread = P.spread;
  let rHTML = '', tHTML = '', lHTML = '';
  const originX = mx(ORIGIN.x), originY = my(ORIGIN.y);
  if (am) {
    const lo = ease(ramp(t, am.t, 0.35));
    if (P.targetNames?.length && spread && t >= am.t && t < spread.t) {
      const pulse = (t - am.t) / 1.3 % 1;
      const fade = lo * (1 - ease(ramp(t, spread.t - 0.4, 0.4)));
      lHTML += `<circle cx="${originX}" cy="${originY}" r="${64 + 126 * pulse}"
        fill="none" stroke="${PAL.route}" stroke-width="8" opacity="${(0.8 * Math.sin(Math.PI * pulse) * fade).toFixed(3)}"/>`;
    }
    lHTML += `<g opacity="${lo.toFixed(3)}">
      <rect x="${originX - 62}" y="${originY + 44}" width="124" height="46" rx="13" fill="${PAL.ink}" opacity=".9"/>
      <text x="${originX}" y="${originY + 76}" text-anchor="middle" font-size="30" font-weight="700"
        fill="${PAL.highlight}" font-family='${S.font.family}'>美洲</text></g>`;
  }
  if (spread) {
    // Blueprint may name explicit arrow targets (美洲→…); otherwise keep the
    // default three-route schematic so earlier blueprints render unchanged.
    const explicit = Array.isArray(P.targetNames) && P.targetNames.length > 0;
    const tgs = explicit ? P.targetNames.map((n) => {
      const tg = TARGETS.find((x) => x.name === n);
      if (!tg) throw new Error('blueprint arrow target not in scene table: ' + n);
      return tg;
    }) : TARGETS;
    tgs.forEach((tg, i) => {
      const tx = mx(tg.x), ty = my(tg.y);
      const cx1 = (originX + tx) / 2, cy1 = Math.min(originY, ty) - 92;
      const start = spread.t + i * spread.stagger;
      const k = ease(ramp(t, start, spread.dur));
      const pathD = `M${originX},${originY} Q${cx1},${cy1} ${tx},${ty}`;
      rHTML += `<path d="${pathD}" fill="none" stroke="${PAL.route}" stroke-width="4"
        stroke-dasharray="12 8" opacity="${(0.75 * clamp01(k * 3)).toFixed(3)}"
        stroke-dashoffset="${(-t * 26).toFixed(1)}"/>`;
      if (explicit && k > 0.55) {
        const dx = tx - cx1, dy = ty - cy1, dl = Math.hypot(dx, dy);
        const ux = dx / dl, uy = dy / dl;
        const ax = tx - 16 * ux, ay = ty - 16 * uy;
        rHTML += `<path d="M${tx.toFixed(1)},${ty.toFixed(1)} L${(ax - 8 * uy).toFixed(1)},${(ay + 8 * ux).toFixed(1)} L${(ax + 8 * uy).toFixed(1)},${(ay - 8 * ux).toFixed(1)} Z"
          fill="${PAL.route}" opacity="${(0.9 * clamp01((k - 0.55) / 0.25)).toFixed(3)}"/>`;
      }
      if (k > 0.001) {
        const lo = ease(ramp(t, start + spread.dur * 0.8, 0.3));
        lHTML += `<text x="${tx}" y="${ty - 20}" text-anchor="middle" font-size="25" font-weight="700"
          fill="${PAL.inkSoft}" opacity="${lo.toFixed(3)}" font-family='${S.font.family}'>${tg.name}</text>`;
      }
    });
    // All three ingredient icons travel, round-robin over the resolved routes.
    ING_ORDER.forEach((key, i) => {
      const tg = tgs[i % tgs.length];
      const tx = mx(tg.x), ty = my(tg.y);
      const cx1 = (originX + tx) / 2, cy1 = Math.min(originY, ty) - 92;
      const start = spread.t + i * spread.stagger;
      const k = ease(ramp(t, start, spread.dur));
      if (k > 0.001) {
        // quadratic bezier point at parameter k
        const u = 1 - k;
        const px = u * u * originX + 2 * u * k * cx1 + k * k * tx;
        const py = u * u * originY + 2 * u * k * cy1 + k * k * ty;
        tHTML += `<g transform="translate(${px.toFixed(1)},${py.toFixed(1)}) scale(0.42)" opacity="${clamp01(k * 6).toFixed(3)}">${ING_SHAPES[key]()}</g>`;
      }
    });
  }
  routes.innerHTML = rHTML; travel.innerHTML = tHTML; lab.innerHTML = lHTML;
  const cap = P.caption;
  if (cap) {
    const co = ease(ramp(t, cap.t, 0.4));
    const el = document.getElementById('mapCaption');
    if (!el) {
      // A wrapped (2-line) subtitle pill reaches y≈538 and would cover the
      // caption at 552; lift it only in that case so 1-line scenes stay put.
      const perLine = Math.floor(S.subtitle.maxWidth / S.subtitle.fontSize);
      const lines = Math.ceil((P.subtitle?.text ?? '').length / perLine);
      const capY = lines > 1 ? 500 : 552;
      const g = document.createElementNS(SVGNS, 'g');
      g.setAttribute('id', 'mapCaption');
      g.innerHTML = `<text x="${W / 2}" y="${capY}" text-anchor="middle" font-size="26"
        fill="${PAL.inkSoft}" font-family='${S.font.family}'>${cap.text}</text>`;
      art.appendChild(g);
    }
    document.getElementById('mapCaption').setAttribute('opacity', co.toFixed(3));
  }
}

window.seek = function (t) {
  if (isMap) drawMap(t); else drawHotpot(t);

  const sb = P.subtitle;
  if (sb && t >= sb.start && t < sb.end) {
    sub.style.display = 'block';
    subSpan.textContent = sb.text;
    const k = Math.min(ease(ramp(t, sb.start, 0.16)), 1 - ease(ramp(t, sb.end - 0.16, 0.16)));
    sub.style.opacity = clamp01(k).toFixed(3);
  } else {
    sub.style.display = 'none';
  }

  const cl = P.closing;
  if (cl && t >= cl.start) {
    closing.style.display = 'block';
    const k = ease(ramp(t, cl.start, 0.45));
    closing.style.opacity = k.toFixed(3);
    closing.style.transform = `translateY(${(14 * (1 - k)).toFixed(2)}px)`;
  } else {
    closing.style.display = 'none';
  }
};
window.seek(0);
</script>
</body>
